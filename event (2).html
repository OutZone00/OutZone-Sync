<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event Registration Form</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
body {
font-family: 'Montserrat', sans-serif;
background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
padding: 20px;
/* Added scrollbar */
overflow-y: scroll;
}
.form-container {
background: white;
padding: 30px 35px;
border-radius: 15px;
box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
max-width: 460px;
width: 100%;
animation: formEntrance 1s ease forwards;
opacity: 0;
transform: translateY(50px);
position: relative;
overflow: hidden;
}
h2 {
text-align: center;
color: #4a00e0;
margin-bottom: 25px;
font-weight: 700;
letter-spacing: 1px;
animation: fadeSlideIn 0.8s ease forwards;
opacity: 0;
transform: translateY(-30px);
}
form {
display: flex;
flex-direction: column;
}
label {
font-weight: 700;
margin-top: 20px;
color: #333;
position: relative;
opacity: 0;
animation: fadeInUp 1s ease forwards;
}
label:nth-of-type(1) { animation-delay: 0.3s; }
label:nth-of-type(2) { animation-delay: 0.4s; }
label:nth-of-type(3) { animation-delay: 0.5s; }
label:nth-of-type(4) { animation-delay: 0.6s; }
label:nth-of-type(5) { animation-delay: 0.7s; }
label:nth-of-type(6) { animation-delay: 0.8s; }
input[type="text"],
input[type="email"],
input[type="tel"],
select,
textarea {
width: 100%;
padding: 12px 14px;
margin-top: 8px;
border: 2px solid #ddd;
border-radius: 8px;
font-size: 16px;
transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
box-sizing: border-box;
outline: none;
animation: fadeIn 1s ease forwards;
opacity: 0;
transform: translateY(15px);
}
input[type="text"]:focus,
input[type="email"]:focus,
input[type="tel"]:focus,
select:focus,
textarea:focus {
border-color: #6a11cb;
box-shadow: 0 0 12px rgba(106, 17, 203, 0.7);
background-color: #fafafa;
transform: scale(1.03);
transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}
input[type="text"]:focus::placeholder,
input[type="email"]:focus::placeholder,
input[type="tel"]:focus::placeholder,
select:focus::placeholder,
textarea:focus::placeholder {
color: #aaa;
transition: color 0.3s ease;
}
textarea {
resize: vertical;
min-height: 70px;
}
button {
margin-top: 25px;
background: linear-gradient(45deg, #6a11cb, #2575fc);
border: none;
color: white;
font-size: 18px;
font-weight: 700;
padding: 15px 0;
border-radius: 10px;
cursor: pointer;
box-shadow: 0 6px 20px rgba(101, 40, 255, 0.5);
transition: background 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
animation: fadeInUp 1s ease forwards;
opacity: 0;
transform: translateY(20px);
}
button:hover {
background: linear-gradient(45deg, #4a00b4, #004db3);
box-shadow: 0 10px 30px rgba(74, 0, 180, 0.8);
transform: scale(1.08);
}
button:active {
transform: scale(1);
box-shadow: 0 6px 20px rgba(101, 40, 255, 0.5);
}
/* Animations */
@keyframes formEntrance {
to {
opacity: 1;
transform: translateY(0);
}
}
@keyframes fadeSlideIn{
to {
opacity: 1;
transform: translateY(0);
}
}
@keyframes fadeInUp {
to {
opacity: 1;
transform: translateY(0);
}
}
@keyframes fadeIn {
to {
opacity: 1;
transform: translateY(0);
}
}
</style>
</head>
<body>
<div class="form-container">
<h2>Event Registration</h2>
<form>
<label for="fullname">Full Name</label>
<input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required />
<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" placeholder="e.g. +1 234 567 8901" required />
<label for="event-session">Select Event Session</label>
<select id="event-session" name="event-session" required>
<option value="">-- Choose a session --</option>
<option value="morning">Morning Session (9am - 12pm)</option>
<option value="afternoon">Afternoon Session (1pm - 4pm)</option>
<option value="full-day">Full Day (9am - 4pm)</option>
</select>
<label for="dietary">Dietary Preferences</label>
<select id="dietary" name="dietary" required>
<option value="">-- Select an option --</option>
<option value="none">No dietary restrictions</option>
<option value="vegetarian">Vegetarian</option>
<option value="vegan">Vegan</option>
<option value="gluten-free">Gluten-Free</option>
<option value="halal">Halal</option>
<option value="kosher">Kosher</option>
</select>
<label for="comments">Additional Comments</label>
<textarea id="comments" name="comments" rows="3" placeholder="Any special requests or information?"></textarea>
<button type="submit">Register</button>
</form>
</div>
</body>
</html>
