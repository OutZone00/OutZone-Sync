<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Participation Certificate Generator with PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Gloock&family=Poppins:wght@400;600&display=swap");

    body {
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121212;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 {
      font-family: "Gloock", serif;
      font-weight: 700;
      font-size: 3rem;
      color: #82d8d8;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #00f3ff88;
      animation: glowText 3s ease-in-out infinite alternate;
    }
    form {
      margin-bottom: 3rem;
      background: #1e1e1e;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 0 15px #00f3ff88;
      width: 340px;
      animation: slideUpFadeIn 1.2s ease forwards;
    }
    label {
      display: block;
      margin: 0.8rem 0 0.3rem 0;
      font-weight: 600;
      color: #82d8d8;
      letter-spacing: 0.04em;
      transition: color 0.3s ease;
    }
    input[type="text"] {
      padding: 0.7rem;
      width: 100%;
      font-size: 1rem;
      border: 2px solid #00f3ff;
      border-radius: 8px;
      background: #121212;
      color: #e0e0e0;
      outline: none;
      transition: border-color 0.4s ease, box-shadow 0.3s ease;
      font-weight: 500;
      font-family: "Poppins", sans-serif;
    }
    input[type="text"]:focus {
      border-color: #82d8d8;
      box-shadow: 0 0 8px #00f3ffaa;
      color: #82d8d8;
    }
    button {
      margin-top: 1.8rem;
      background-color: #00f3ff;
      color: #121212;
      border: none;
      padding: 0.9rem 0;
      font-size: 1.2rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      box-shadow: 0 5px 15px #00f3ffaa;
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }
    button:hover {
      background-color: #46ffff;
      box-shadow: 0 6px 20px #46ffffcc;
    }
    #certificate {
      max-width: 700px;
      border: 10px double #00f3ff;
      padding: 3rem;
      text-align: center;
      box-shadow: 0 0 30px #00f3ffbb;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #00303f 0%, #001f29 100%);
      border-radius: 20px;
      color: #ffe;
      font-family: "Gloock", serif;
      margin-bottom: 1.5rem;
      animation: fadeScaleIn 0.7s ease forwards;
      display:none;
    }
    #certificate h2 {
      margin-bottom: 1rem;
      font-size: 2.8rem;
      text-decoration: underline;
      color: #00f3ff;
      font-weight: 900;
      text-shadow: 0 0 8px #00f3ff88;
    }
    #certificate p {
      margin: 1rem 0;
      font-style: italic;
      color: #ade2e6;
    }

    @keyframes fadeScaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUpFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glowText {
      0% {
        text-shadow: 0 0 8px #00f3ff88;
        color: #82d8d8;
      }
      100% {
        text-shadow: 0 0 20px #00f3ffee;
        color: #a0f8ff;
      }
    }
  </style>
</head>
<body>

  <h1>Participation Certificate Generator</h1>
  <form id="certForm" autocomplete="off">
    <label for="candidateName">Candidate Name:</label>
    <input type="text" id="candidateName" name="candidateName" placeholder="Enter candidate's full name" required />
    
    <label for="eventName">Event Name:</label>
    <input type="text" id="eventName" name="eventName" placeholder="Enter event name" required />
    
    <button type="submit">Generate Certificate</button>
  </form>

  <div id="certificate">
    <h2>Certificate of Participation</h2>
    <p>This is to certify that</p>
    <p id="certName" style="font-weight:bold; font-size:1.8rem; color:#00f3ff;"></p>
    <p>has participated in the event</p>
    <p id="certEvent" style="font-weight:bold; font-size:1.8rem; color:#00f3ff;"></p>
    <p>with outstanding enthusiasm and dedication.</p>
    <br />
    <p>Date: <span id="certDate"></span></p>
  </div>

  <button id="downloadPdfBtn" style="display:none; margin-bottom: 3rem; border-radius:12px; padding: 0.8rem 2rem; background-color: #0e6c7b; color:#fff; border:none; cursor:pointer; font-weight:700; font-size:1.2rem;">Download PDF</button>

  <script>
    const { jsPDF } = window.jspdf;
    const form = document.getElementById("certForm");
    const certificate = document.getElementById("certificate");
    const certName = document.getElementById("certName");
    const certEvent = document.getElementById("certEvent");
    const certDate = document.getElementById("certDate");
    const downloadPdfBtn = document.getElementById("downloadPdfBtn");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const name = form.candidateName.value.trim();
      const eventName = form.eventName.value.trim();

      if (name === "" || eventName === "") {
        alert("Please fill in both fields.");
        return;
      }

      certName.textContent = name;
      certEvent.textContent = eventName;

      const today = new Date();
      certDate.textContent = today.toLocaleDateString(undefined, {
        year: "numeric",
        month: "long",
        day: "numeric",
      });

      certificate.style.display = "block";
      certificate.scrollIntoView({ behavior: "smooth" });
      downloadPdfBtn.style.display = "inline-block";
    });

    downloadPdfBtn.addEventListener("click", function () {
      // Create jsPDF instance
      const doc = new jsPDF({
        orientation: "landscape",
        unit: "pt",
        format: [595, 420]
      });

      // Set fonts and style similar to CSS styles used
      doc.setFont("times", "normal");
      doc.setFontSize(28);
      doc.setTextColor(0, 243, 255);
      doc.text("Certificate of Participation", 295, 60, null, null, "center");

      doc.setDrawColor(0, 243, 255);
      doc.setLineWidth(4);
      doc.rect(20, 20, 555, 380, "S");

      doc.setFontSize(16);
      doc.setTextColor(173, 226, 230);
      doc.text("This is to certify that", 295, 120, null, null, "center");

      doc.setFontSize(24);
      doc.setTextColor(0, 243, 255);
      doc.setFont("times", "bold");
      doc.text(certName.textContent, 295, 160, null, null, "center");

      doc.setFontSize(16);
      doc.setFont("times", "normal");
      doc.text("has participated in the event", 295, 200, null, null, "center");

      doc.setFontSize(24);
      doc.setFont("times", "bold");
      doc.text(certEvent.textContent, 295, 240, null, null, "center");

      doc.setFontSize(16);
      doc.setFont("times", "normal");
      doc.text(
        "with outstanding enthusiasm and dedication.",
        295,
        280,
        null,
        null,
        "center"
      );

      doc.setFontSize(14);
      doc.text("Date: " + certDate.textContent, 295, 320, null, null, "center");

      // Save the PDF
      doc.save("Participation-Certificate.pdf");
    });
  </script>

</body>
</html>
