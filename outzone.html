
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User-Friendly Interview Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #282290;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #354052;
      min-height: 100vh;
    }
    header {
      background: #0f3766;
      padding: 24px 0;
      text-align: center;
      font-size: 2.6em;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #fff;
      box-shadow: 0 3px 10px rgba(74, 144, 226, 0.5);
    }
    nav {
      background: #e1eaff;
      padding: 14px 0;
      display: flex;
      justify-content: center;
      gap: 32px;
      font-size: 1.14em;
      font-weight: 600;
    }
    nav a {
      color: #4a90e2;
      text-decoration: none;
      transition: color 0.3s, transform 0.2s;
      padding: 6px 12px;
      border-radius: 6px;
    }
    nav a:hover {
      background: #4a90e2;
      color: #fff;
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 4px 14px rgba(74, 144, 226, 0.6);
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(53, 64, 82, 0.15);
      padding: 40px 36px;
      text-align: center;
    }
    .user-image {
      width: 110px;
      height: 110px;
      border-radius: 55px;
      margin: 0 auto 28px;
      object-fit: cover;
      box-shadow: 0 0 15px rgba(74, 144, 226, 0.4);
      background: #d9e6f8;
    }
    h2 {
      font-size: 1.8em;
      color: #2a3a59;
      margin: 0 0 24px 0;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      font-size: 1.14em;
      color: #4a90e2;
      cursor: pointer;
      padding: 14px 16px;
      margin: 14px 0;
      background-color: #e7f0ff;
      border-radius: 10px;
      user-select: none;
      transition: background-color 0.25s, transform 0.20s;
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(74, 144, 226, 0.15);
    }
    li:hover {
      background-color: #4a90e2;
      color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 8px 22px rgba(74, 144, 226, 0.6);
    }
    .icon {
      font-size: 1.6em;
    }
    /* Modal Styles */
    .modal-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.35);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-bg.active {
      display: flex;
    }
    .modal {
      background: #fff;
      padding: 30px 28px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 14px 34px rgba(74, 144, 226, 0.4);
      color: #354052;
      font-size: 1.15em;
      text-align: center;
      position: relative;
      font-weight: 600;
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      background: none;
      border: none;
      font-size: 1.8em;
      color: #4a90e2;
      cursor: pointer;
      transition: color 0.3s;
    }
    .close-btn:hover {
      color: #1e50a2;
    }
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 12px;
        font-size: 1.1em;
        padding: 20px 0 40px;
      }
      main {
        margin: 20px 12px;
        padding: 32px 20px;
      }
    }
  </style>
</head>
<body>
<header><strong>Plan your perfect event</strong>  </header>
<nav>
  <a href="home.html"><u>Home</u></a> 
  <a href="#"><u>Profile</u></a>
 
</nav>
<main>
  <img class="user-image" src="https://infohub.gomomentus.com/hubfs/ShutterStock%20Images/artificial-intelligence-blog-image.jpg" alt="User Avatar" />
  <h2>Welcome, User!</h2>
  <ul>
    <a href="admitpage.html" target="_blank">
    <li onclick="showInfo(0)"><span class="icon">📝</span> Admin  login </li> </a>
    <a href="event (2).html" target="_blank">
    <li onclick="showInfo(1)"><span class="icon">🎯</span> Register for an event </li></a>
    <a href="pastevent (2).html"><li onclick="showInfo(2)"><span class="icon">📌</span> View upcoming / past event </li></a>
    
    
  <a href="certificate2.html"> <li onclick="showInfo(3)"><span class="icon">🗃️</span> Download the participation certificate PDF </li></a>
   
  </ul>
</main>
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <div id="modal-text"></div>
  </div>
</div>
<script>
  const infoTexts = [
    "Browse through hundreds of coding problems to practice and improve your skills.",
    "Get real-time feedback on your code submissions including correctness and efficiency.",
    "Visualize your coding progress with detailed stats and milestone achievements.",
    "Participate in exciting timed contests and climb the leaderboard."
  ];
  function showInfo(idx) {
    document.getElementById('modal-text').textContent = infoTexts[idx];
    document.getElementById('modal-bg').classList.add('active');
  }
  function closeModal() {
    document.getElementById('modal-bg').classList.remove('active');
  }
</script>
</body>
</html>
