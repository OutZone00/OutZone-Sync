<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animated Secure User Form</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #e3f2fd; /* light secure blue */
    display: flex;
    justify-content: center;
    padding: 2rem;
  }

  form {
    background: #ffffff;
    padding: 2rem;
    border-radius: 0.8rem;
    box-shadow: 0 0 15px rgba(14, 108, 123, 0.4);
    width: 350px;
  }

  h2 {
    color: #0e6c7b; /* dark teal */
    text-align: center;
    margin-bottom: 1rem;
  }

  .form-group {
    position: relative;
    margin-bottom: 1.8rem;
  }

  label {
    position: absolute;
    left: 12px;
    top: 14px;
    background: white;
    padding: 0 6px;
    color: #0e6c7b;
    font-weight: 600;
    font-size: 0.9rem;
    pointer-events: none;
    transform-origin: left top;
    transition: 0.3s ease all;
    border-radius: 3px;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  textarea {
    width: 100%;
    padding: 16px 12px 16px 12px;
    font-size: 1rem;
    border: 2px solid #4db6ac; /* teal */
    border-radius: 8px;
    outline: none;
    transition: border-color 0.3s ease;
  }

  textarea {
    resize: vertical;
  }

  /* Animate label - move up when input is focused or has text */
  input:focus + label,
  input:not(:placeholder-shown) + label,
  textarea:focus + label,
  textarea:not(:placeholder-shown) + label {
    top: -10px;
    left: 8px;
    font-size: 0.75rem;
    color: #00796b; /* stronger teal */
    font-weight: 700;
    transform: scale(0.9);
  }

  input:focus,
  textarea:focus {
    border-color: #00796b;
    box-shadow: 0 0 8px #00796b77;
  }

  button {
    background-color: #00796b;
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    width: 100%;
    font-weight: 700;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #004d40;
  }
</style>
</head>
<body>

<form action="https://formspree.io/f/mgvnowjv" method="post" novalidate>
  <h2>Talent search form!!!!</h2>

  <div class="form-group">
    <input type="text" id="name" name="name" placeholder=" " required />
    <label for="name">Name</label>
  </div>

  <div class="form-group">
    <input type="email" id="email" name="email" placeholder=" " required />
    <label for="email">Email</label>
  </div>

  <div class="form-group">
    <input type="tel" id="contact" name="contact" placeholder=" " pattern="[0-9]{10}" required />
    <label for="contact">Contact Number</label>
  </div>

  <div class="form-group">
    <input type="text" id="skills" name="skills" placeholder=" " />
    <label for="skills">Skills</label>
  </div>

  <div class="form-group">
    <textarea id="experience" name="experience" rows="4" placeholder=" "></textarea>
    <label for="experience">Previous Experience</label>
  </div>

  <button type="submit">Submit</button>
</form>

</body>
</html>
